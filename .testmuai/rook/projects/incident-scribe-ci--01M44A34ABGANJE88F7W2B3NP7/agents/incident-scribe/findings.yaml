- severity: high
  what: >-
    A follow-up execute can reuse the prior session's service record without performing the
    policy-required fresh lookup.
  where: incident_scribe/agent.py:run_turn; docs/incident-policy.pdf section 4
  why: >-
    A later task in the same session can state an owning team, tier, or on-call address from stale
    state even though attribution must be read from ops-directory during that task.
  id: FI-001
- severity: high
  what: >-
    The code does not enforce the instruction that every completed assessment must call both
    incident-history tools.
  where: incident_scribe/agent.py:SCRIBE_SYSTEM and run_turn
  why: >-
    The model can return a completed assessment after calling only some of lookup_service,
    recent_incidents, and search_incidents, so claims about prior incidents may lack the required
    search evidence.
  id: FI-002
- severity: high
  what: >-
    An unplaceable report is not deterministically converted to needs_input when the model
    nevertheless supplies a severity.
  where: incident_scribe/agent.py:run_turn policy_severity check
  why: >-
    The policy requires a question instead of a severity for reports with no placeable symptom, but
    the current condition only rejects a missing severity; an asserted arbitrary severity can pass
    when policy_severity is null.
  id: FI-003
- severity: medium
  what: The post-generation customer-note sanitizer does not robustly remove all internal hostnames.
  where: incident_scribe/agent.py:_clean_note; docs/incident-policy.pdf section 3
  why: >-
    Its hostname pattern is limited to .internal with at most one two-letter suffix, so names such
    as runbooks.internal.northwind or other internal naming schemes can remain if the subagent emits
    them.
  id: FI-004
