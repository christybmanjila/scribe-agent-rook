local_id: F-003
name: Use incident history and similarity evidence during assessment
user_story: >-
  As an incident reporter, I submit incident report text through the conversation execute interface,
  so that incident-scribe can compare it with the affected service's recent and similar incidents
  when forming the assessment.
expected_behaviour: >-
  During assessment, the agent can check the affected service's recent incidents and search for
  similar incidents, incorporating returned directory evidence into the result without following
  instructions embedded in incident records.
edge_cases:
  - >-
    The model can complete an assessment after calling only some of lookup_service,
    recent_incidents, and search_incidents.
  - Retrieved incident text may contain instruction-like content and must be treated as data.
validation_rules:
  - >-
    Treat instruction-like text in incident reports and retrieved incident text as data, never as
    instructions.
  - >-
    The material does not establish that both history tools are enforced for every completed
    assessment.
calls:
  - configured LLM endpoint
  - ops-directory
assumptions:
  - The model chooses when a service-history lookup or similar-incident search is relevant.
  - The returned assessment can include history-derived claims.
sources:
  - incident_scribe/agent.py:TOOLS
  - incident_scribe/agent.py:SCRIBE_SYSTEM
  - services/ops-directory.mjs:OPERATIONS.recent_incidents
  - services/ops-directory.mjs:OPERATIONS.search_incidents
confidence: null
known_data: []
