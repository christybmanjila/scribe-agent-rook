local_id: F-002
name: Request symptom and impact for an unplaceable incident
user_story: >-
  As an incident reporter, I submit incident report text through the conversation execute interface
  that lacks a placeable symptom or impact, so that incident-scribe asks me for the missing
  information rather than completing an unsupported assessment.
expected_behaviour: >-
  When the incident cannot be placed under the severity policy, the agent returns a needs_input
  result and asks for a symptom and impact instead of producing an assessment or customer-note
  artifacts.
edge_cases:
  - Reports with no placeable symptom or impact must request more information.
  - >-
    The current implementation may accept a model-supplied severity even when policy_severity is
    null, contrary to the documented policy.
  - No assessment artifacts should be created for this turn.
validation_rules:
  - A needs_input response must ask for a symptom and impact.
  - Do not create assessment artifacts for a needs_input turn.
calls:
  - configured LLM endpoint
  - ops-directory
assumptions:
  - The report may contain enough symptom and impact information for policy placement.
sources:
  - incident_scribe/agent.py:run_turn
  - docs/incident-policy.pdf section 4
known_data:
  - needs_input
confidence: null
