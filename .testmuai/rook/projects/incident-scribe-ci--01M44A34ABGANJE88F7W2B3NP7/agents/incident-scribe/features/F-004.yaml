local_id: F-004
name: Index a completed incident when its session closes
user_story: >-
  As an incident desk operator, I close a session after a completed incident assessment, so that
  incident-scribe indexes the completed record in the operations directory's learned corpus.
expected_behaviour: >-
  When a session containing a completed incident record is closed, the agent sends the
  record—including service, severity, summary, symptoms, session id, and date—to ops-directory for
  indexing and returns the indexing result and corpus metadata.
edge_cases:
  - A needs_input turn must not create an assessment artifact to index.
  - Only a completed record is eligible for indexing.
  - Indexing occurs when the caller closes the session, not during execute.
validation_rules:
  - Only index a completed record when closing a session.
  - Do not index a needs_input turn.
calls:
  - ops-directory
assumptions:
  - The caller closes the session after a completed assessment.
  - The completed record contains the fields required by index_incident.
sources:
  - incident_scribe/__main__.py:_index_latest_record
  - services/ops-directory.mjs:OPERATIONS.index_incident
confidence: null
known_data: []
