local_id: F-001
name: Assess a placeable incident and produce a customer note
user_story: >-
  As an incident reporter, I submit incident report text through the conversation execute interface,
  so that incident-scribe identifies the affected service and severity and returns a
  directory-backed assessment with a customer-facing note.
expected_behaviour: >-
  For a placeable incident report, the agent determines the affected service and severity using the
  operations directory and the S1/S2/S3 policy matrix, obtains directory-derived team, tier,
  on-call, runbook, and image fields, generates a customer-facing status note, and returns a
  completed JSON result with the assessment and derived artifacts. Attribution must come from
  ops-directory rather than being invented or inferred.
edge_cases:
  - >-
    A later execute in the same session may reuse a prior service record without a fresh directory
    lookup.
  - The model may complete an assessment without calling both incident-history tools.
  - >-
    Internal runbook URLs, on-call email addresses, internal hostnames, and severity codes must not
    appear in the customer note.
  - The note sanitizer may fail to remove hostnames such as runbooks.internal.northwind.
validation_rules:
  - Do not claim an owning team, tier, or on-call address unless obtained from ops-directory.
  - Use the documented S1/S2/S3 severity matrix.
  - >-
    Keep internal runbook URLs, on-call email addresses, internal hostnames, and severity codes out
    of the customer note.
calls:
  - configured LLM endpoint
  - ops-directory
  - comms-writer
assumptions:
  - The model can identify the affected service and produce an assessment from the incident report.
  - >-
    The documented S1/S2/S3 matrix is available to the model, but its detailed thresholds are not
    included in this material.
sources:
  - incident_scribe/agent.py:run_turn
  - incident_scribe/agent.py:TOOLS
  - incident_scribe/agent.py:COMMS_SYSTEM
  - docs/incident-policy.pdf section 3
  - docs/incident-policy.pdf section 4
  - services/ops-directory.mjs:OPERATIONS.lookup_service
known_data:
  - S1
  - S2
  - S3
confidence: null
