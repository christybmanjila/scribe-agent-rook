local_id: F-002
name: Request a symptom for an unplaceable incident
user_story: >-
  As an incident reporter, I submit a plain-language report that lacks a symptom needed by the
  S1/S2/S3 matrix, so that the desk asks me for the missing symptom instead of inventing a severity.
expected_behaviour: >-
  The desk returns needs_input and asks for a symptom when the incident report cannot be placed in
  the severity matrix; it does not complete the assessment or write the two completion artifacts.
edge_cases:
  - The desk must ask for a symptom when the report cannot be placed in the matrix.
  - It must not assign a severity solely to return a completed result.
  - An incomplete report produces no customer-note or incident-record artifacts.
validation_rules:
  - Ask for a symptom when the report cannot be placed in the matrix.
  - Do not assign severity merely to produce one.
  - Incomplete reports return needs_input without artifacts.
calls:
  - configured model endpoint (BASE_URL)
  - session filesystem (.scribe-sessions)
assumptions:
  - The report does not contain enough information to select a row in the S1/S2/S3 matrix.
  - The caller can provide another conversation turn after the desk asks a question.
sources:
  - incident_scribe/agent.py:run_turn
  - docs/incident-policy.pdf
  - test_incident_scribe.py
known_data:
  - S1
  - S2
  - S3
  - needs_input
confidence: null
