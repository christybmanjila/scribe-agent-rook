local_id: F-001
name: Assess a registered incident using directory facts and policy severity
user_story: >-
  As an incident reporter, I submit a plain-language incident report through execute, so that the
  desk verifies the affected service and history, applies the appropriate S1/S2/S3 policy row, and
  produces a completed assessment and customer note.
expected_behaviour: >-
  Given a report for a registered service, the desk looks up the service, obtains relevant incident
  history, assigns the matching S1/S2/S3 policy severity, delegates a three- or four-sentence
  customer-facing status note to comms-writer, and returns one completed JSON result containing the
  assessment, severity, service fields, call records, metrics, image URLs, and paths to the
  customer-note and incident-record artifacts.
edge_cases:
  - >-
    The service must be registered before ownership, tier, contact, or image metadata can be
    reported.
  - >-
    Follow-up turns may reuse the session transcript, but the current-task attribution requirement
    may require a fresh directory lookup.
  - Incident history can be retrieved for the reported service and searched by symptom.
validation_rules:
  - Do not state an owning team, tier, or on-call address unless obtained from lookup_service.
  - Use the stated S1/S2/S3 severity matrix and identify the matching row.
  - Do not invent ownership or tier for an unregistered service.
calls:
  - ops-directory
  - configured model endpoint (BASE_URL)
  - comms-writer
  - session filesystem (.scribe-sessions)
assumptions:
  - The caller provides a plain-language incident report through the execute conversation interface.
  - The configured model endpoint and ops-directory MCP server are available.
sources:
  - incident_scribe/agent.py:run_turn
  - incident_scribe/agent.py:COMMS_SYSTEM
  - incident_scribe/mcp.py:OpsDirectory.call
  - services/ops-directory.mjs
  - docs/incident-policy.pdf
known_data:
  - S1
  - S2
  - S3
confidence: null
