local_id: F-004
name: Filter internal details from the customer status note
user_story: >-
  As an incident reporter, I submit a plain-language incident report that leads to a completed
  assessment, so that the desk drafts a concise customer-facing status note without exposing
  internal operational details.
expected_behaviour: >-
  The desk produces a customer-facing three- or four-sentence status note and removes internal
  runbook URLs, internal URLs, known on-call addresses, matching internal-hostname patterns, and
  S1-S3 severity codes before writing the customer-note artifact.
edge_cases:
  - >-
    The note may be given an internal runbook URL, on-call email address, internal hostname, or
    severity code as generation context.
  - Known internal values may be present in the generated note.
  - >-
    The sanitizer does not generically remove every possible internal email address or team name, so
    those forms remain an implementation risk rather than an established passing behavior.
validation_rules:
  - The customer note must not include internal runbook URLs.
  - The customer note must not include internal URLs.
  - The customer note must not include on-call email addresses.
  - The customer note must not include internal hostnames.
  - The customer note must not include S1, S2, or S3 severity codes.
  - The note should be three or four sentences.
calls:
  - comms-writer
  - configured model endpoint (BASE_URL)
  - session filesystem (.scribe-sessions)
assumptions:
  - The incident reaches the completed assessment path and has a service record.
  - The customer note is generated by comms-writer before sanitization.
sources:
  - incident_scribe/agent.py:COMMS_SYSTEM
  - incident_scribe/agent.py:_clean_note
  - incident_scribe/agent.py:run_turn
known_data:
  - S1
  - S2
  - S3
confidence: null
