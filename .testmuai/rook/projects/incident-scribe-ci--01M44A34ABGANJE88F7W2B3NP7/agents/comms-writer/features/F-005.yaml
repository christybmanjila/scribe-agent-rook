local_id: F-005
name: Index the completed incident record on session close
user_story: >-
  As an incident desk operator, I close a session after the incident assessment is complete, so that
  the completed incident record becomes searchable in the operations directory.
expected_behaviour: >-
  When the caller closes a session with a completed incident record, the desk indexes that record
  through the ops-directory MCP index_incident operation and returns the indexing outcome/searchable
  corpus metadata.
edge_cases:
  - Indexing occurs only when a session is closed with a completed incident record.
  - The indexed record includes the service, severity, assessment summary, symptoms, and session id.
validation_rules:
  - Index only a completed incident record.
  - Pass the service, severity, assessment summary, symptoms, and session id to index_incident.
calls:
  - session filesystem (.scribe-sessions)
  - ops-directory
assumptions:
  - The assessment completes successfully.
  - The caller invokes the close command after a completed incident record exists.
sources:
  - incident_scribe/__main__.py:_index_latest_record
  - incident_scribe/__main__.py:close command
  - services/ops-directory.mjs
confidence: null
known_data: []
